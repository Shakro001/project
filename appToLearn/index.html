<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verben mit Präpositionen</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f3f4f6; color: #1f2937; }
  header { background: #374151; color: #fff; padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  header button { background: #4b5563; color: #fff; border: 0; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  header button.active { background: #2563eb; }
  main { max-width: 680px; margin: 20px auto; padding: 0 12px; }
  .card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .type { font-size: 12px; text-transform: uppercase; color: #6b7280; letter-spacing: .05em; }
  .q { font-size: 22px; margin: 12px 0 20px; line-height: 1.4; }
  .hint { color: #6b7280; font-size: 15px; margin-top: -12px; margin-bottom: 16px; }
  .gap { display: inline-block; min-width: 60px; border-bottom: 2px solid #2563eb; text-align: center; color: #2563eb; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opts button { font-size: 18px; padding: 14px; border: 2px solid #d1d5db; background: #fff; border-radius: 8px; cursor: pointer; }
  .opts button:hover:not(:disabled) { border-color: #2563eb; }
  .opts button.ok { background: #dcfce7; border-color: #16a34a; }
  .opts button.bad { background: #fee2e2; border-color: #dc2626; }
  input[type=text] { width: 100%; font-size: 20px; padding: 12px; border: 2px solid #d1d5db; border-radius: 8px; }
  input.ok { border-color: #16a34a; background: #dcfce7; }
  input.bad { border-color: #dc2626; background: #fee2e2; }
  .fb { margin-top: 16px; padding: 12px; border-radius: 8px; display: none; line-height: 1.5; }
  .fb.ok { display: block; background: #dcfce7; }
  .fb.bad { display: block; background: #fee2e2; }
  .next { margin-top: 16px; width: 100%; padding: 14px; font-size: 18px; background: #2563eb; color: #fff; border: 0; border-radius: 8px; cursor: pointer; display: none; }
  .stats { display: flex; justify-content: space-between; color: #6b7280; font-size: 14px; margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; font-size: 14px; }
  td, th { padding: 8px; border-bottom: 1px solid #e5e7eb; text-align: left; vertical-align: top; }
  .lvl { display: inline-block; width: 60px; height: 8px; background: #e5e7eb; border-radius: 4px; overflow: hidden; }
  .lvl i { display: block; height: 100%; background: #16a34a; }
  .key { font-size: 12px; color: #9ca3af; margin-top: 12px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>🇩🇪 Verben + Präpositionen</h1>
  <button id="btnTrain" class="active">Тренировка</button>
  <button id="btnList">Список</button>
</header>
<main id="app"></main>

<script>
// [глагол, предлог, падеж, перевод, предложение с [пропуском]]
const RAW = [
["sich aufregen","über","A","злиться, волноваться из-за","Sie hat sich sehr [über] das Prüfungsergebnis aufgeregt."],
["sich bemühen","um","A","стараться (добиться чего-то)","Eva bemüht sich [um] eine bessere Aussprache des Englischen."],
["berichten","über","A","сообщать, докладывать о","Der Reporter berichtet [über] die Proteste."],
["sich beschweren","bei","D","жаловаться (кому)","Herr Schmitz beschwert sich [beim] Manager über das dreckige Hotelzimmer."],
["sich beschweren","über","A","жаловаться (на что)","Herr Schmitz beschwert sich beim Manager [über] das dreckige Hotelzimmer."],
["sich beziehen","auf","A","относиться к, ссылаться на","Das Pronomen „es“ bezieht sich im Text [auf] das Kind."],
["sich entschließen","zu","D","решиться на","Ich habe mich [zu] einer Reise nach Japan entschlossen."],
["sich erkundigen","bei","D","справляться (у кого)","Bitte erkundigen Sie sich [bei] der Sekretärin nach einem Termin."],
["sich erkundigen","nach","D","осведомляться (о чём)","Bitte erkundigen Sie sich bei der Sekretärin [nach] einem Termin."],
["ersetzen","durch","A","заменять на","Ersetzen Sie bitte die Verben [durch] Nomen!"],
,
];

const ITEMS = RAW.map(([verb, prep, cas, ru, sent], i) => ({ id: i, verb, prep, cas, ru, sent }));
const PREPS = ["an","auf","aus","bei","durch","für","gegen","in","mit","nach","über","um","unter","von","vor","zu"];
const CONTR = ["vom","zum","beim","am","im","zur"];
const TWOWAY = ["an","auf","in","über","unter","vor"];

// ---------- прогресс (локально) ----------
const KEY = "vmp_progress_v1";
let P = JSON.parse(localStorage.getItem(KEY) || "{}"); // id -> {lvl, seen, ok}
const prog = id => P[id] || (P[id] = { lvl: 0, seen: 0, ok: 0 });
const save = () => localStorage.setItem(KEY, JSON.stringify(P));
let session = { ok: 0, total: 0, streak: 0 };
let recent = [];

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const label = it => `${it.verb} ${it.prep} + ${it.cas === "A" ? "Akk" : "Dat"}`;
const norm = s => s.toLowerCase().replace(/\bsich\b/g, "").replace(/[+]|akk|dat|\b[ad]\b/g, "").replace(/\s+/g, " ").trim();

// Выбор слова: чем ниже уровень — тем чаще; недавние не повторяем
function pickItem() {
  const pool = ITEMS.filter(it => !recent.includes(it.id));
  const weights = pool.map(it => { const p = prog(it.id); return p.seen === 0 ? 6 : Math.pow(2, 5 - Math.min(p.lvl, 5)); });
  let r = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < pool.length; i++) { r -= weights[i]; if (r <= 0) return pool[i]; }
  return pool[0];
}

// ---------- типы заданий ----------
function gapParts(it) {
  const m = it.sent.match(/^(.*)\[(.+?)\](.*)$/);
  return { before: m[1], ans: m[2], after: m[3] };
}

function prepDistractors(correct, n) {
  const low = correct.toLowerCase();
  const base = CONTR.includes(low) ? CONTR : PREPS;
  const res = shuffle(base.filter(p => p !== low)).slice(0, n);
  const cap = correct[0] !== correct[0].toLowerCase();
  return res.map(p => cap ? p[0].toUpperCase() + p.slice(1) : p);
}

const TASKS = {
  // 1. Русский → выбрать глагол+предлог
  ruToDe(it) {
    const same = ITEMS.filter(x => x.verb === it.verb && x.prep !== it.prep);
    const fakes = shuffle(PREPS.filter(p => p !== it.prep && !same.some(s => s.prep === p))).slice(0, 2)
      .map(p => `${it.verb} ${p}`);
    const others = shuffle(ITEMS.filter(x => x.verb !== it.verb)).slice(0, 3).map(x => `${x.verb} ${x.prep}`);
    const opts = shuffle([`${it.verb} ${it.prep}`, ...shuffle([...fakes, ...others]).slice(0, 3)]);
    return { type: "Перевод → немецкий", q: `«${it.ru}»`, opts, ans: `${it.verb} ${it.prep}` };
  },
  // 2. Глагол → предлог
  verbToPrep(it) {
    return { type: "Какой предлог?", q: `<b>${it.verb}</b> <span class="gap">?</span>`, hint: it.ru,
      opts: shuffle([it.prep, ...prepDistractors(it.prep, 3)]), ans: it.prep };
  },
  // 3. Пропуск в предложении (выбор)
  gapChoice(it) {
    const g = gapParts(it);
    return { type: "Вставь предлог", q: `${g.before}<span class="gap">___</span>${g.after}`,
      opts: shuffle([g.ans, ...prepDistractors(g.ans, 3)]), ans: g.ans };
  },
  // 4. Падеж
  caseChoice(it) {
    return { type: "Какой падеж?", q: `<b>${it.verb} ${it.prep}</b> + <span class="gap">?</span>`, hint: it.ru,
      opts: ["Akkusativ", "Dativ"], ans: it.cas === "A" ? "Akkusativ" : "Dativ" };
  },
  // 5. Пропуск в предложении (ввод)
  gapType(it) {
    const g = gapParts(it);
    return { type: "Напиши предлог", q: `${g.before}<span class="gap">___</span>${g.after}`, hint: it.ru,
      input: true, check: v => v.trim().toLowerCase() === g.ans.toLowerCase(), ans: g.ans };
  },
  // 6. Русский → написать глагол + предлог
  ruType(it) {
    return { type: "Напиши глагол + предлог", q: `«${it.ru}»`, hint: "например: hoffen auf (sich можно не писать)",
      input: true, check: v => norm(v) === norm(`${it.verb} ${it.prep}`), ans: `${it.verb} ${it.prep}` };
  },
};

// Новые слова — лёгкие задания, выученные — сложные (ввод)
function pickTask(it) {
  const lvl = prog(it.id).lvl;
  let list;
  if (lvl <= 1) list = ["ruToDe", "verbToPrep", "gapChoice"];
  else if (lvl <= 3) list = ["verbToPrep", "gapChoice", "gapType", "ruType", "ruToDe"];
  else list = ["gapType", "ruType", "ruType", "gapType"];
  if (TWOWAY.includes(it.prep) && Math.random() < 0.3) return "caseChoice";
  return list[Math.random() * list.length | 0];
}

// ---------- UI ----------
const app = document.getElementById("app");
let current = null;

function renderTrain() {
  const it = pickItem();
  recent.push(it.id); if (recent.length > 8) recent.shift();
  const t = TASKS[pickTask(it)](it);
  current = { it, t, done: false };
  const learned = ITEMS.filter(x => prog(x.id).lvl >= 4).length;

  app.innerHTML = `
    <div class="stats"><span>Сессия: ${session.ok}/${session.total} · серия 🔥${session.streak}</span>
      <span>Выучено: ${learned}/${ITEMS.length}</span></div>
    <div class="card">
      <div class="type">${t.type}</div>
      <div class="q">${t.q}</div>
      ${t.hint ? `<div class="hint">${t.hint}</div>` : ""}
      ${t.input
        ? `<input type="text" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Ответ + Enter">`
        : `<div class="opts">${t.opts.map(o => `<button data-v="${o}">${o}</button>`).join("")}</div>`}
      <div class="fb" id="fb"></div>
      <button class="next" id="next">Дальше →</button>
    </div>
    <div class="key">Enter — проверить / дальше · клавиши 1–4 — варианты</div>`;

  if (t.input) {
    const inp = document.getElementById("inp");
    inp.focus();
  } else {
    app.querySelectorAll(".opts button").forEach(b => b.onclick = () => answer(b.dataset.v, b));
  }
  document.getElementById("next").onclick = renderTrain;
}

function answer(val, btn) {
  if (current.done) return;
  current.done = true;
  const { it, t } = current;
  const ok = t.input ? t.check(val) : val === t.ans;
  const p = prog(it.id);
  p.seen++;
  if (ok) { p.ok++; p.lvl = Math.min(p.lvl + 1, 6); session.ok++; session.streak++; }
  else { p.lvl = Math.max(p.lvl - 2, 0); session.streak = 0; recent = recent.filter(x => x !== it.id); recent.splice(-3); }
  session.total++;
  save();

  if (t.input) document.getElementById("inp").className = ok ? "ok" : "bad";
  else app.querySelectorAll(".opts button").forEach(b => {
    b.disabled = true;
    if (b.dataset.v === t.ans) b.classList.add("ok");
    else if (b === btn) b.classList.add("bad");
  });

  const fb = document.getElementById("fb");
  fb.className = "fb " + (ok ? "ok" : "bad");
  fb.innerHTML = `${ok ? "✅ Верно!" : `❌ Правильно: <b>${t.ans}</b>`}<br>
    <b>${label(it)}</b> — ${it.ru}<br><i>${it.sent.replace(/\[(.+?)\]/, "<b>$1</b>")}</i>`;
  const next = document.getElementById("next");
  next.style.display = "block";
  if (!t.input) next.focus();
}

document.addEventListener("keydown", e => {
  if (!current || app.dataset.view !== "train") return;
  if (e.key === "Enter") {
    if (current.done) { e.preventDefault(); renderTrain(); }
    else if (current.t.input) { const v = document.getElementById("inp").value; if (v.trim()) answer(v); }
  } else if (!current.done && !current.t.input && /^[1-4]$/.test(e.key)) {
    const b = app.querySelectorAll(".opts button")[+e.key - 1];
    if (b) answer(b.dataset.v, b);
  }
});

function renderList() {
  const rows = ITEMS.map(it => {
    const p = prog(it.id);
    return `<tr><td><b>${label(it)}</b></td><td>${it.ru}<br><small style="color:#6b7280">${it.sent.replace(/\[(.+?)\]/, "<b>$1</b>")}</small></td>
      <td><span class="lvl"><i style="width:${Math.min(p.lvl, 4) / 4 * 100}%"></i></span><br><small>${p.ok}/${p.seen}</small></td></tr>`;
  }).join("");
  app.innerHTML = `<table><tr><th>Глагол</th><th>Перевод / пример</th><th>Прогресс</th></tr>${rows}</table>
    <p style="text-align:center"><button id="reset">Сбросить прогресс</button></p>`;
  document.getElementById("reset").onclick = () => { if (confirm("Сбросить весь прогресс?")) { P = {}; save(); renderList(); } };
}

function show(view) {
  app.dataset.view = view;
  document.getElementById("btnTrain").classList.toggle("active", view === "train");
  document.getElementById("btnList").classList.toggle("active", view === "list");
  view === "train" ? renderTrain() : renderList();
}
document.getElementById("btnTrain").onclick = () => show("train");
document.getElementById("btnList").onclick = () => show("list");
show("train");
</script>
</body>
</html>
